<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>팀 메모리</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { const theme = localStorage.getItem("tm.theme"); if (theme) document.documentElement.dataset.theme = theme; } catch {}
  </script>
</head>
<body>
  <div class="shell" id="team-memory-app">
    <aside class="rail" id="rail">
      <div class="mark"><img class="logo" src="/logo.svg" alt=""><strong>팀 메모리</strong></div>
      <nav class="nav" id="nav" aria-label="메뉴"></nav>
      <div class="rail-foot">
        <div class="who" id="who"><b id="who-name">—</b><small id="who-space">—</small></div>
        <div class="machine" id="machine" hidden></div>
        <button class="btn quiet icon-only small" id="theme" type="button" title="화면 밝기"></button>
      </div>
    </aside>
    <div class="main">
      <div class="mobile-bar">
        <button class="btn icon-only small" id="menu" type="button" aria-label="메뉴">☰</button>
        <img class="logo" src="/logo.svg" alt=""><strong>팀 메모리</strong>
      </div>
      <main id="page" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
